[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaaran"
version = "0.1.0"
description = "AI data analyst for Block and District Education Officers (Kaaran)"
requires-python = ">=3.11"
# Pinned: the synthetic generator promises identical file hashes per seed,
# which only holds for fixed library versions.
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "openpyxl==3.1.5",
    "reportlab==5.1.0",
    "pdfplumber==0.11.10",
    "pypdfium2==5.14.0",
    "duckdb==2.0.0",
    "anthropic==2.1.0",
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kaaran = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests (pdfplumber PDF reading, multi-seed runs); skip with -m \"not slow\"",
    "live: calls the Anthropic API (costs money); run only with --live",
]
